<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada – Visão</title>
  <meta name="description" content="A página que você procura não foi encontrada.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f7a63">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Página não encontrada">
  <meta property="og:description" content="A página que você procura não foi encontrada.">
  <!-- Estilos embutidos de propósito: o GitHub Pages serve esta página em qualquer endereço
       inexistente (inclusive em subpastas), e um "style.css" relativo não seria encontrado. -->
  <style>
    :root { color-scheme: light dark; --principal: #1f7a63; --sobre: #fff; --fundo: #fff; --texto: #14211e; --suave: #4a5b57; }
    @media (prefers-color-scheme: dark) {
      :root { --principal: #4fc3a1; --sobre: #06231b; --fundo: #0e1513; --texto: #e6efec; --suave: #a9bab5; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6;
           background: var(--fundo); color: var(--texto); }
    main { max-width: 30rem; }
    .codigo { font-size: clamp(4rem, 18vw, 7rem); font-weight: 800; line-height: 1; margin: 0 0 .5rem; color: var(--principal); }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 .5rem; }
    p { color: var(--suave); margin: 0 0 1.5rem; }
    a.btn { display: inline-block; padding: .7rem 1.5rem; border-radius: 999px; background: var(--principal);
            color: var(--sobre); font-weight: 600; text-decoration: none; }
    a.btn:hover { opacity: .9; }
    a:focus-visible { outline: 3px solid var(--principal); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou foi movido.</p>
    <a class="btn" href="index.html">Voltar ao início</a>
  </main>
</body>
</html>
